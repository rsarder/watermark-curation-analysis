[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "watermark-robustness"
version = "0.1.0"
description = "Evaluating dataset watermark robustness under data curation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<27",
    "scikit-learn>=1.5,<2",
    "threadpoolctl>=3.1,<4",
    "transformers>=4.41,<6",
]

[project.optional-dependencies]
curation = ["sentence-transformers>=4.1,<6", "torch>=2.6,<3"]
training = ["torch>=2.6,<3"]
dev = ["ruff>=0.9,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
watermark-data = "watermark_robustness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["watermark_robustness*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
